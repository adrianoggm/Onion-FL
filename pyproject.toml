[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onion-fl"
version = "0.1.0"
description = "Hierarchical federated learning (edge-fog-cloud) experimentation framework"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "Adriano Garcia"}]
keywords = ["federated-learning", "fog-computing", "hierarchical-fl", "stress-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2,<3",
    "numpy>=1.25,<3",  # BitGenerator.seed_seq (fine-tune scoring)
    "pandas>=1.5,<4",
    "scikit-learn>=1.2,<2",
    "paho-mqtt>=2.0,<3",
    "pyyaml>=6,<7",
    "opentelemetry-sdk>=1.24,<2",
    "opentelemetry-exporter-otlp>=1.24,<2",
    "prometheus-client>=0.17,<1",
    "pydantic>=2.12,<3",  # Field(exclude_if=...) keeps config_ids stable
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16,<0.17",  # keep in sync with .pre-commit-config.yaml
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "pre-commit>=3,<5",
    "fastapi>=0.110,<1",  # Studio API tests (same pins as the studio extra)
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
]
# Onion-FL Studio: onion_fl serve
studio = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]
# XGBoost baseline (onion_fl.baselines) and analysis scripts (scripts/, results/legacy/)
analysis = [
    "matplotlib>=3.5,<4",
    "seaborn>=0.12,<1",
    "xgboost>=2,<4",
]

[project.scripts]
onion_fl = "onion_fl.experiment.cli:main"

[project.urls]
Repository = "https://github.com/adrianoggm/Onion-FL"
Issues = "https://github.com/adrianoggm/Onion-FL/issues"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.package-data]
onion_fl = ["studio/static/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["onion_fl*"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["*.md"]  # Python code blocks in docs are illustrative, not formatted

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line length is handled by the formatter
    "B008", # function calls in argument defaults
    "E402", # `from __future__ import annotations` sits above module docstrings
]

[tool.ruff.lint.isort]
known-first-party = ["onion_fl"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/onion_fl"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
