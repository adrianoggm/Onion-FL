# SWELL-KW (Koldijk et al., 2014): per-minute features of 25 knowledge workers
# under three conditions. Only the computer-interaction file is required; facial
# expressions and physiology are optional joins (spec §8.6).
#
# Checked on 2026-10-03 against "3 - Feature dataset/per sensor" from DANS
# (doi:10.17026/dans-x55-69zp):
#   - 999 means missing in the facial and physiology files (both say so); the
#     computer counters also peak at exactly 999, so they keep it;
#   - the facial file uses ';' and decimal commas;
#   - the physiology file calls the block column 'C', so it joins without blok
#     (pp, condition and timestamp are unique per row);
#   - body posture is left out: the per-minute Kinect file has every date one
#     month early (20120931 for 31 October), so its rows only align by position.
name: swell
description: SWELL-KW, features por minuto de 25 participantes; estrés según la condición (N, T, I, R).
root: "data/SWELL/3 - Feature dataset/per sensor"
options:
  facial: false
  physiology: false
source:
  reader: csv
  path: "A - Computer interaction features (Ulog - All Features per minute)-Sheet_1.csv"
  sep: null
  encoding: utf-8-sig
  na_values: ["#VALUE!"]
  normalize_columns: true
steps:
  - subject: {column: pp, regex: "(\\d+)"}
  - join:
      source:
        reader: csv
        path: "B - Facial expressions features (FaceReaderAllData_final (NaN is 999))-sheet_1.csv"
        sep: null
        encoding: utf-8-sig
        decimal: ","
        na_values: ["999", "#VALUE!"]
        normalize_columns: true
      by: [pp, blok, condition, timestamp]
      pad: {timestamp: 18}      # as the time step: stamps that lost their zeros
    when: {facial: true}
  - join:
      source:
        reader: csv
        path: "D - Physiology features (HR_HRV_SCL - final).csv"
        sep: null
        encoding: utf-8-sig
        na_values: ["999", "#VALUE!"]
        normalize_columns: true
      by: [pp, condition, timestamp]
      pad: {timestamp: 18}
    when: {physiology: true}
  - time:                   # each minute row's stamp; meta, never a feature
      column: timestamp
      format: "%Y%m%dT%H%M%S%f"
      pad_to: 18                # a few stamps lost their trailing zeros in the sheet
  - label:
      default: binary
      strategies:
        # As the previous loaders: R counts as stress.
        binary: {task: stress_binary, column: condition, map: {"N": 0, "T": 1, "I": 1, "R": 1}}
        # R rows dropped, for those who read R as rest rather than stress.
        binary_no_r: {task: stress_binary, column: condition, map: {"N": 0, "T": 1, "I": 1}}
  - features:
      regex: "^(?!unnamed)"     # empty spreadsheet columns
      exclude: [blok, timestamp, c]
