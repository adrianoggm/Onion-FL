# PhysioNet "Wearable Device Dataset from Induced Stress and Structured Exercise
# Sessions" v1.0.1 (PhysioNet, ODC-By 1.0): Empatica E4 at the native
# rates, with the harmonized E4 features of datasets/wesad_e4.yaml (issue #240).
# One subject per participant: S01-S18 did protocol V1, f01-f18 protocol V2
# (README.txt), so the 36 are different people. Each participant's STRESS,
# AEROBIC and ANAEROBIC sessions are separate recordings: windows never span two.
#
# Labels come from the protocol tags (button presses, tags.csv). The reader
# gives each sample its segment, ACTIVITY_V<version>_<k>, with k the tags
# pressed so far. Which segment is which stage follows the protocol figures and
# the stress intervals of the dataset's Wearable_Dataset.ipynb:
#   STRESS V1 (13 tags): 1 baseline, 3 Stroop, 4 first rest, 5 TMCT, 6 second
#     rest, 7 real opinion, 9 opposite opinion, 11 subtract test.
#   STRESS V2 (9 tags): 2 TMCT, 3 first rest, 4 real opinion, 6 opposite
#     opinion, 7 second rest, 8 subtract test. The V2 baseline has no tag at its
#     start (the recordings start about 4 to 39 minutes before tag 1), so it is
#     not used. V2 dropped the Stroop.
#   AEROBIC V1 (12 tags): 1-10 the cycling blocks, 60 to 110 rpm.
#   AEROBIC V2 (8 tags): 1-5 the blocks, 70 to 90/95 rpm.
#   ANAEROBIC V1 (7 tags): 1, 3, 5 the sprints; V2 (11 tags): 2, 4, 6, 8.
# Warm-up, cool-down, the pauses between tasks (self-reports, instructions) and
# anything after the last stage have no class. A window is kept only when all
# its label samples share one class (label: unanimous).
#
# The 30 s stages (opinions, subtract test, sprints) are shorter than the 60 s
# windows of WESAD, so at the default window they give no windows: stress comes
# from the Stroop and TMCT, and exercise from the aerobic blocks. Checked on the
# real data (2026-11-10, tests/test_datasets_descriptors.py): binary gives 35
# subjects and 1,446 windows (1,243 rest, 203 stress); three_class 36 subjects
# and 2,643 windows (plus 1,197 exercise). With window_seconds 30, binary gives
# 3,221 windows, 560 of them stress. Every labelled session has its protocol's
# tag count, and the 30 s stages fall 15-75 s apart where the map puts them.
# AEROBIC/f07's tags 5 and 6 were written swapped, 12 s apart: the reader sorts
# the tags. A participant's sessions come in path order, not in time order.
#
# data_constraints.txt, applied by the select step below:
#   STRESS/S02: from 1548 s after its start each file repeats the session from
#     the beginning (checked: identical values). The repeat is cut; it starts
#     after S02's last tag anyway.
#   STRESS/f07: the dock covered the PPG and temperature sensors: BVP and TEMP
#     are invalid, so the session is dropped (only EDA and ACC were valid).
#   STRESS/f14: split by a Bluetooth loss. f14_a holds the V2 baseline, which
#     is not used, and has no tags; f14_b holds the tagged protocol and is used.
#   AEROBIC/S03, AEROBIC/S07 (ended early), ANAEROBIC/S06 (last sprint missing):
#     the last tags no longer follow the protocol, so the sessions are dropped.
#   AEROBIC/S11 and ANAEROBIC/S16: split, with the tag count restarting in the
#     second file, so both parts are dropped. AEROBIC/S12 has no session.
#   ANAEROBIC/S01: its IBI.csv is empty; IBI is not a default signal.
#
# The session, segment and time columns are meta: never features.
name: physionet_e4
description: PhysioNet Wearable Device (Empatica E4) con estrés inducido y ejercicio, a tasas nativas y con las features E4 armonizadas; un sujeto por participante.
root: data/PhysioNetE4
options:
  signals: "ACC,BVP,EDA,TEMP"
  window_seconds: 60
  overlap: 0.5
source:
  reader: physionet_wearable
  path: "Wearable_Dataset/*/{subject}/EDA.csv"
  signals: "{signals}"
steps:
  - subject: {regex: "^([Sf]\\d{2})"}   # the session folder, S11_a -> S11
  - select:
      query: >-
        session not in ['STRESS/f07', 'AEROBIC/S03', 'AEROBIC/S07',
        'AEROBIC/S11_a', 'AEROBIC/S11_b', 'ANAEROBIC/S06', 'ANAEROBIC/S16_a',
        'ANAEROBIC/S16_b']
        and not (session == 'STRESS/S02' and time >= 1361387717)
  - time: {column: time}    # Unix seconds (the files' UTC dates)
  - label:
      default: binary
      strategies:
        binary:
          task: stress_binary
          column: segment
          map:
            STRESS_V1_1: 0     # baseline
            STRESS_V1_3: 1     # Stroop
            STRESS_V1_4: 0     # first rest
            STRESS_V1_5: 1     # TMCT
            STRESS_V1_6: 0     # second rest
            STRESS_V1_7: 1     # real opinion
            STRESS_V1_9: 1     # opposite opinion
            STRESS_V1_11: 1    # subtract test
            STRESS_V2_2: 1     # TMCT
            STRESS_V2_3: 0     # first rest
            STRESS_V2_4: 1     # real opinion
            STRESS_V2_6: 1     # opposite opinion
            STRESS_V2_7: 0     # second rest
            STRESS_V2_8: 1     # subtract test
        three_class:
          task: stress_vs_exercise
          column: segment
          map:
            STRESS_V1_1: 0
            STRESS_V1_3: 1
            STRESS_V1_4: 0
            STRESS_V1_5: 1
            STRESS_V1_6: 0
            STRESS_V1_7: 1
            STRESS_V1_9: 1
            STRESS_V1_11: 1
            STRESS_V2_2: 1
            STRESS_V2_3: 0
            STRESS_V2_4: 1
            STRESS_V2_6: 1
            STRESS_V2_7: 0
            STRESS_V2_8: 1
            AEROBIC_V1_1: 2    # 60 rpm
            AEROBIC_V1_2: 2
            AEROBIC_V1_3: 2
            AEROBIC_V1_4: 2
            AEROBIC_V1_5: 2
            AEROBIC_V1_6: 2
            AEROBIC_V1_7: 2
            AEROBIC_V1_8: 2
            AEROBIC_V1_9: 2
            AEROBIC_V1_10: 2   # 110 rpm
            AEROBIC_V2_1: 2    # 70 rpm
            AEROBIC_V2_2: 2
            AEROBIC_V2_3: 2
            AEROBIC_V2_4: 2
            AEROBIC_V2_5: 2    # 90/95 rpm
            ANAEROBIC_V1_1: 2  # sprints
            ANAEROBIC_V1_3: 2
            ANAEROBIC_V1_5: 2
            ANAEROBIC_V2_2: 2
            ANAEROBIC_V2_4: 2
            ANAEROBIC_V2_6: 2
            ANAEROBIC_V2_8: 2
  - multirate_window:
      seconds: "{window_seconds}"
      overlap: "{overlap}"
      label: unanimous
  - features:
      regex: "_(mean|std|min|max|median)$"
