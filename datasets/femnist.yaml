# FEMNIST (LEAF, Caldas et al., 2018): handwritten digits and letters of NIST
# SD19, 28x28 grey images, 62 classes, one natural client per writer. LEAF's
# preprocessing writes them as JSON, 100 writers per file (`all_data_<k>.json`);
# `scripts/femnist_from_flower.py` writes the same format from the Flower
# Datasets copy (README §2).
#
# Checked on 2026-11-05 against flwrlabs/femnist (814,277 images of 3,597
# writers, 18 to 583 per writer): the pixels are grey levels / 255 with a white
# background (1.0), and the classes are 0-9, then A-Z, then a-z.
#
# The full dataset has ~3,600 writers; the simulator is checked with hundreds of
# edges, not thousands (README §10). So the descriptor reads a fixed subsample of
# 200 writers (44,451 images): numpy default_rng(206).choice over the 3,597
# writer ids sorted, without replacement, sorted. The writer id is the subject
# and is never a feature; the 784 pixels are the features.
name: femnist
description: FEMNIST (LEAF), dígitos y letras manuscritos de 28x28, 62 clases; un sujeto por escritor (200 escritores fijos).
root: data/FEMNIST
source:
  reader: leaf_json
  path: "all_data/*.json"
