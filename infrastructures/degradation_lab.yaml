# The physical continuum of the degradation x topology study (issue #290): two
# zones, each a field of devices behind an access link to its zone's servers,
# and each zone behind its own WAN link to the cloud. Every topology of the
# study runs on these same machines; only where the logical nodes sit changes.
# The nominal access links have the numbers of the runtime's `lan` preset. The
# numbers are illustrative, not calibrated (I12, issue #197).
#
# The degraded variants (degradation_lab_*.yaml) differ from this file only in
# what their header says.
name: degradation_lab
profiles:
  cloud_vm:     {cpus: 8, memory: 16GB, train_rate: 20000, aggregate_rate: 5.0e8}
  fog_small:    {cpus: 4, memory: 4GB,  train_rate: 4000,  aggregate_rate: 1.0e8}
  raspberry_pi: {cpus: 4, memory: 4GB,  train_rate: 900}
sites:
  dc:      {hosts: {cloud-1: cloud_vm}}
  zone_a:  {hosts: {gw-a: fog_small, fog-a1: fog_small, fog-a2: fog_small}}
  zone_b:  {hosts: {gw-b: fog_small, fog-b1: fog_small, fog-b2: fog_small}}
  field_a: {pool: {raspberry_pi: 8}}
  field_b: {pool: {raspberry_pi: 8}}
network:
  links:
    - {between: [field_a, zone_a], latency: 1ms, jitter: 0.2ms, distribution: normal, bandwidth: 1Gbps}
    - {between: [field_b, zone_b], latency: 1ms, jitter: 0.2ms, distribution: normal, bandwidth: 1Gbps}
    - {between: [zone_a, dc], latency: 70ms, bandwidth: 10Mbps}
    - {between: [zone_b, dc], latency: 70ms, bandwidth: 10Mbps}
