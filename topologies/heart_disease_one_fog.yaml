# One fog under the cloud, for the arms of the Fed-Heart-Disease triangle with
# a single edge (pooled and local-only, issue #251). With pooled placement on
# heart_disease_two_fogs, the fog left without edges never registers and the
# run never starts, so those arms run here.
name: heart_disease_one_fog
levels: [global, fog, edge]
root:
  id: cloud
  aggregator: fedavg
  server_optimizer: replace
fog:
  defaults:
    aggregator: fedavg
    quorum: 1.0
    link_up: {transport: mqtt, codec: json, profile: lan}
  nodes:
    - {id: fog_0}
edge:
  link_up: {transport: mqtt, codec: json, profile: lan}
