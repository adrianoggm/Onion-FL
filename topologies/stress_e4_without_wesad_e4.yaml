# stress_e4_studies without the fog of wesad_e4 (issue #244): the topology of the
# leave-one-dataset-out scenario that keeps wesad_e4 for testing only.
name: stress_e4_without_wesad_e4
levels: [global, fog, edge]
root:
  id: cloud
  aggregator: fedavg
  server_optimizer: replace
fog:
  defaults:
    aggregator: fedavg
    quorum: 1.0
    link_up: {transport: mqtt, codec: npz, profile: lan}
  nodes:
    - {id: lab_physionet, home: physionet_e4}
    - {id: hospital_nurse, home: nurse_stress}
    - {id: lab_stress_predict, home: stress_predict}
edge:
  link_up: {transport: mqtt, codec: npz, profile: lan}
