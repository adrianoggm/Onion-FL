# Four fogs under one cloud for FEMNIST's hundreds of writers (issue #206).
# The links use the npz codec: with ~120k parameters per model, JSON encoding
# made each simulated round ~16 times slower (results/sim_scale/).
name: femnist_four_fogs
levels: [global, fog, edge]
root:
  id: cloud
  aggregator: fedavg
  server_optimizer: replace
fog:
  defaults:
    aggregator: fedavg
    quorum: 1.0
    link_up: {transport: mqtt, codec: npz, profile: lan}
  nodes:
    - {id: fog_0}
    - {id: fog_1}
    - {id: fog_2}
    - {id: fog_3}
edge:
  link_up: {transport: mqtt, codec: npz, profile: lan}
