# One fog under the cloud, on lossless links: the topology of a centralised
# reference, where the pooled placement puts each dataset's training subjects
# in a single edge (issue #240).
name: one_fog
levels: [global, fog, edge]
root:
  id: cloud
  aggregator: fedavg
  server_optimizer: replace
fog:
  defaults:
    aggregator: fedavg
    quorum: 1.0
    link_up: {transport: mqtt, codec: npz, profile: lan}
  nodes:
    - {id: fog_0}
edge:
  link_up: {transport: mqtt, codec: npz, profile: lan}
