# Prometheus configuration for Onion-FL
# ============================================================================
# Scrapes the PrometheusSink of the runs on the host and the OTEL collector
# Includes spanmetrics for Jaeger Service Dependencies
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'onion-fl-monitor'

# Alerting configuration (optional - uncomment if using Alertmanager)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Rule files (optional - for recording rules and alerts)
# rule_files:
#   - "first_rules.yml"
#   - "second_rules.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OpenTelemetry Collector internal metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
    metrics_path: /metrics

  # Span metrics from OTEL Collector - Required for Jaeger Service Dependencies
  - job_name: 'spanmetrics'
    static_configs:
      - targets: ['otel-collector:8889']
    metrics_path: /metrics

  # Onion-FL runs (observability.sinks.PrometheusSink.serve, default port 9464)
  - job_name: 'onion-fl'
    static_configs:
      - targets: ['host.docker.internal:9464']
    metrics_path: /metrics
    scrape_interval: 5s
