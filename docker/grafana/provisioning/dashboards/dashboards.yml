# Grafana Dashboard Provisioning
# Auto-loads dashboards from the specified path

apiVersion: 1

providers:
  - name: 'Onion-FL Dashboards'
    orgId: 1
    folder: 'Onion-FL'
    folderUid: onion-fl
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
