# Two model families on SWELL and WESAD (issue #229): modular_mlp against
# feature_transformer (one token per feature, attention trunk), three seeds,
# FedAvg, segregated placement, lossless links. Everything else is FedAvg's
# configuration in techniques_server.yaml. Each family's SGD rate was chosen
# with model_families_select.yaml, by the final global model on the
# validation subjects: 0.1 for the MLP, 0.3 for the transformer (at 1.0 it
# diverged).
#
#   onion_fl run experiments/model_families.yaml --workers 2
name: model_families
description: Comparación de dos familias de modelos (MLP modular y transformer sobre features) en SWELL y WESAD.
topology: four_fogs_swell_wesad_lossless
data:
  datasets:
    swell: {}
    wesad: {}
  roles: {test: 0.2, val: 0.1, local_val: 0.2, local_val_split: class_tail, scaler: global, seed: 0}
  placement: {name: mixing, alpha: 0.0}
learning:
  model: {name: modular_mlp, adapter_width: 64, trunk_hidden: [64, 32], dropout: 0.2}
  sharing: fedavg
  trainer: {name: standard, optimizer: sgd, local_epochs: 10, batch_size: 32, lr: 0.1}
  init: random
rounds: 20
evaluation:
  metrics: [loss, accuracy, macro_f1]
  edge: {every: 5, models: [received, local]}
  aggregators: {every: 5}
  global: {every: 1}
seeds: [0, 1, 2]
sweep:
  learning.model,learning.trainer.lr:
    - [{name: modular_mlp, adapter_width: 64, trunk_hidden: [64, 32], dropout: 0.2}, 0.1]
    - [{name: feature_transformer, token_dim: 16, blocks: 1, attention_heads: 2, ffn_factor: 2, dropout: 0.1}, 0.3]
