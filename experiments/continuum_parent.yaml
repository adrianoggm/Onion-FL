# The parent of the continuum warm start (issue #157): a federation trained on
# SWELL only, on the SWELL half of the drift comparison's topology
# (two_fogs_swell_lossless) with its placement and training (FedAvg, SGD at lr
# 0.1, its rate on validation there). Each run leaves its bundle in runs/<run_id>/bundle/.
#
#   onion_fl run experiments/continuum_parent.yaml --workers 3
name: continuum_parent
description: Modelo padre del continuum entrenado solo con SWELL.
topology: two_fogs_swell_lossless
data:
  datasets:
    swell: {}
  roles: {test: 0.2, val: 0.1, local_val: 0.2, local_val_split: class_tail, scaler: global, seed: 0}
  placement: {name: mixing, alpha: 0.0}
learning:
  model: {name: modular_mlp, adapter_width: 64, trunk_hidden: [64, 32], dropout: 0.2}
  sharing: fedavg
  trainer: &sgd {name: standard, optimizer: sgd, local_epochs: 10, batch_size: 32, lr: 0.1}
  init: random
rounds: 20
evaluation:
  metrics: [loss, accuracy, macro_f1]
  edge: {every: 5, models: [received, local]}
  aggregators: {every: 5}
  global: {every: 1}
seeds: [0, 1, 2]
