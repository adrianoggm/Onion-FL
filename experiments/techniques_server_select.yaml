# Server-rate selection for techniques_server.yaml, scored by the final global
# model's macro-F1 on the validation subjects (`evaluation.global.subjects:
# val`), so the server optimizer's own output is what decides; the test
# subjects are never evaluated here. Seed 0. FedAvgM at server_lr 0.1, 0.3 and
# 1.0; FedAdam and FedYogi at 0.01, 0.03 and 0.1; FedAdagrad also at 0.3;
# FedAsync at alpha 0.3, 0.6 and 0.9 on the buffering topology, where it sees
# staleness. Where the best value sat on an edge of its grid, the grid was
# widened by one step (FedAvgM 0.03, FedYogi 0.3, FedAdagrad 1.0, alpha 1.0).
#
#   onion_fl run experiments/techniques_server_select.yaml --workers 3
name: techniques_server_select
description: Selección del lr de servidor de cada optimizador sobre los sujetos de validación.
topology: four_fogs_swell_wesad_lossless
data:
  datasets:
    swell: {}
    wesad: {}
  roles: {test: 0.2, val: 0.1, local_val: 0.2, local_val_split: class_tail, scaler: global, seed: 0}
  placement: {name: mixing, alpha: 0.0}
learning:
  model: {name: modular_mlp, adapter_width: 64, trunk_hidden: [64, 32], dropout: 0.2}
  sharing: fedavg
  trainer: {name: standard, optimizer: sgd, local_epochs: 10, batch_size: 32, lr: 0.1}
  init: random
rounds: 20
evaluation:
  metrics: [loss, accuracy, macro_f1]
  edge: {every: 5, models: [received, local]}
  aggregators: {every: 5}
  global: {every: 20, subjects: val}   # the final global model, on validation
seeds: [0]
sweep:
  topology,learning.server_optimizer:
    - [four_fogs_swell_wesad_lossless, {name: fedavgm, server_lr: 0.03}]
    - [four_fogs_swell_wesad_lossless, {name: fedavgm, server_lr: 0.1}]
    - [four_fogs_swell_wesad_lossless, {name: fedavgm, server_lr: 0.3}]
    - [four_fogs_swell_wesad_lossless, {name: fedavgm, server_lr: 1.0}]
    - [four_fogs_swell_wesad_lossless, {name: fedadam, server_lr: 0.01}]
    - [four_fogs_swell_wesad_lossless, {name: fedadam, server_lr: 0.03}]
    - [four_fogs_swell_wesad_lossless, {name: fedadam, server_lr: 0.1}]
    - [four_fogs_swell_wesad_lossless, {name: fedyogi, server_lr: 0.01}]
    - [four_fogs_swell_wesad_lossless, {name: fedyogi, server_lr: 0.03}]
    - [four_fogs_swell_wesad_lossless, {name: fedyogi, server_lr: 0.1}]
    - [four_fogs_swell_wesad_lossless, {name: fedyogi, server_lr: 0.3}]
    - [four_fogs_swell_wesad_lossless, {name: fedadagrad, server_lr: 0.01}]
    - [four_fogs_swell_wesad_lossless, {name: fedadagrad, server_lr: 0.03}]
    - [four_fogs_swell_wesad_lossless, {name: fedadagrad, server_lr: 0.1}]
    - [four_fogs_swell_wesad_lossless, {name: fedadagrad, server_lr: 0.3}]
    - [four_fogs_swell_wesad_lossless, {name: fedadagrad, server_lr: 1.0}]
    - [four_fogs_swell_wesad_lossless_fedbuff, {name: fedasync, alpha: 0.3}]
    - [four_fogs_swell_wesad_lossless_fedbuff, {name: fedasync, alpha: 0.6}]
    - [four_fogs_swell_wesad_lossless_fedbuff, {name: fedasync, alpha: 0.9}]
    - [four_fogs_swell_wesad_lossless_fedbuff, {name: fedasync, alpha: 1.0}]
