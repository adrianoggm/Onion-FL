# Differential privacy on SWELL and WESAD (issue #149): central DP at the fogs
# (dp_fedavg) and local DP at the edges (local_dp), at two noise levels, against
# plain FedAvg. Three seeds; every run reports its epsilon per round (delta 1e-5,
# RDP without subsampling amplification). C = 1.0 is the median edge update
# norm under FedAvg, a training statistic. Lossless links, so that lost rounds
# do not mix with the noise.
#
#   onion_fl plan experiments/techniques_privacy.yaml
#   onion_fl run experiments/techniques_privacy.yaml --workers 3
name: techniques_privacy
description: Privacidad diferencial central y local sobre SWELL y WESAD.
topology: four_fogs_swell_wesad_lossless
data:
  datasets:
    swell: {}
    wesad: {}
  roles: {test: 0.2, val: 0.1, local_val: 0.2, local_val_split: class_tail, scaler: global, seed: 0}
  placement: {name: mixing, alpha: 0.5}
learning:
  model: {name: modular_mlp, adapter_width: 64, trunk_hidden: [64, 32], dropout: 0.2}
  sharing: fedavg
  trainer: {name: standard, optimizer: sgd, local_epochs: 10, batch_size: 32, lr: 0.3}
  init: random
rounds: 20
evaluation:
  metrics: [loss, accuracy, macro_f1]
  global: {every: 1}
seeds: [0, 1, 2]
sweep:
  learning.aggregator,privacy:
    - [fedavg, null]
    - [{name: dp_fedavg, clip: 1.0, sigma: 0.5}, null]
    - [{name: dp_fedavg, clip: 1.0, sigma: 1.0}, null]
    - [fedavg, {name: local_dp, clip: 1.0, sigma: 0.5}]
    - [fedavg, {name: local_dp, clip: 1.0, sigma: 1.0}]
