# Robust aggregation under attack on SWELL and WESAD (issue #149): every leaf
# aggregator (fog) runs the same aggregator; 20% of each dataset's edges flip
# the sign of their update (scale 1, or scale 5, which with 20% attackers makes
# the averaged update point against learning), or nobody attacks. Three seeds. Training as in the
# first drift selection (SGD, lr 0.3, FedAvg's rate on validation there); the clipping
# bound is the median edge update norm under FedAvg (1.02), not a test score.
# The defences assume the 20% attacker fraction, not a test score: the trimmed
# mean cuts 20% per side; fogs hold 6-8 edges, so about 1-2 attackers each, and
# Krum and Multi-Krum tolerate f = 2 (lowered to 1 where n < 7); Bulyan needs
# n >= 4f + 3, so f = 1, which the 6-edge fogs lower to 0. Lossless links, so
# that lost rounds do not mix with the attack.
#
#   onion_fl plan experiments/techniques_robustness.yaml
#   onion_fl run experiments/techniques_robustness.yaml --workers 3
name: techniques_robustness
description: Agregación robusta frente a inversión de signo sobre SWELL y WESAD.
topology: four_fogs_swell_wesad_lossless
data:
  datasets:
    swell: {}
    wesad: {}
  roles: {test: 0.2, val: 0.1, local_val: 0.2, local_val_split: class_tail, scaler: global, seed: 0}
  placement: {name: mixing, alpha: 0.5}
learning:
  model: {name: modular_mlp, adapter_width: 64, trunk_hidden: [64, 32], dropout: 0.2}
  sharing: fedavg
  trainer: {name: standard, optimizer: sgd, local_epochs: 10, batch_size: 32, lr: 0.3}
  init: random
rounds: 20
evaluation:
  metrics: [loss, accuracy, macro_f1]
  global: {every: 1}
seeds: [0, 1, 2]
sweep:
  learning.aggregator:
    - fedavg
    - median
    - {name: trimmed_mean, beta: 0.2}
    - {name: krum, f: 2}
    - {name: multi_krum, f: 2}
    - geometric_median
    - {name: bulyan, f: 1}
    - {name: norm_clip, bound: 1.0}
  attack:
    - null
    - {name: sign_flip, fraction: 0.2}
    - {name: sign_flip, fraction: 0.2, scale: 5.0}
