# Learning-rate selection for model_families.yaml (issue #229), scored by the
# final global model's macro-F1 on the validation subjects (`evaluation.global.
# subjects: val`); the test subjects are never evaluated here. Seed 0, SGD at
# 0.03, 0.1 and 0.3 for each family, everything else as in model_families.yaml.
#
#   onion_fl run experiments/model_families_select.yaml --workers 2
name: model_families_select
description: Selección del lr de cada familia de modelos sobre los sujetos de validación.
topology: four_fogs_swell_wesad_lossless
data:
  datasets:
    swell: {}
    wesad: {}
  roles: {test: 0.2, val: 0.1, local_val: 0.2, local_val_split: class_tail, scaler: global, seed: 0}
  placement: {name: mixing, alpha: 0.0}
learning:
  model: {name: modular_mlp, adapter_width: 64, trunk_hidden: [64, 32], dropout: 0.2}
  sharing: fedavg
  trainer: {name: standard, optimizer: sgd, local_epochs: 10, batch_size: 32, lr: 0.1}
  init: random
rounds: 20
evaluation:
  metrics: [loss, accuracy, macro_f1]
  edge: {every: 5, models: [received, local]}
  aggregators: {every: 5}
  global: {every: 20, subjects: val}   # the final global model, on validation
seeds: [0]
sweep:
  learning.model,learning.trainer.lr:
    - [{name: modular_mlp, adapter_width: 64, trunk_hidden: [64, 32], dropout: 0.2}, 0.03]
    - [{name: modular_mlp, adapter_width: 64, trunk_hidden: [64, 32], dropout: 0.2}, 0.1]
    - [{name: modular_mlp, adapter_width: 64, trunk_hidden: [64, 32], dropout: 0.2}, 0.3]
    - [{name: feature_transformer, token_dim: 16, blocks: 1, attention_heads: 2, ffn_factor: 2, dropout: 0.1}, 0.03]
    - [{name: feature_transformer, token_dim: 16, blocks: 1, attention_heads: 2, ffn_factor: 2, dropout: 0.1}, 0.1]
    - [{name: feature_transformer, token_dim: 16, blocks: 1, attention_heads: 2, ffn_factor: 2, dropout: 0.1}, 0.3]
