# The drift techniques of techniques_drift.yaml over lossy links (wifi loses
# 0.5% of messages, 4g 1%), with the same learning rates: how each technique
# copes with lost updates and lost rounds, which matters most for those that
# keep state on both sides (SCAFFOLD, FedDyn).
#
#   onion_fl run experiments/techniques_drift_lossy.yaml --workers 3
name: techniques_drift_lossy
description: Las técnicas de deriva no IID sobre enlaces con pérdidas (wifi 0,5 %, 4g 1 %).
topology: four_fogs_swell_wesad
data:
  datasets:
    swell: {}
    wesad: {}
  roles: {test: 0.2, val: 0.1, local_val: 0.2, local_val_split: class_tail, scaler: global, seed: 0}
  placement: {name: mixing, alpha: 0.0}
learning:
  model: {name: modular_mlp, adapter_width: 64, trunk_hidden: [64, 32], dropout: 0.2}
  sharing: fedavg
  trainer: &sgd {name: standard, optimizer: sgd, local_epochs: 10, batch_size: 32, lr: 0.3}
  init: random
rounds: 20
evaluation:
  metrics: [loss, accuracy, macro_f1]
  edge: {every: 5, models: [received, local]}
  aggregators: {every: 5}
  global: {every: 1}
seeds: [0, 1, 2]
sweep:
  learning.trainer,learning.server_optimizer:
    - [{<<: *sgd, name: standard, lr: 0.1}, replace]   # FedAvg
    - [{<<: *sgd, name: fedprox, lr: 0.1}, replace]
    - [{<<: *sgd, name: scaffold, lr: 0.1}, scaffold]
    - [{<<: *sgd, name: fednova, lr: 0.1}, fednova]
    - [{<<: *sgd, name: feddyn, lr: 0.1}, feddyn]
    - [{<<: *sgd, name: moon, lr: 0.1, mu: 0.1}, replace]
